name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]\{1,\};/objectVersion = 56;/g' UySimulyatori.xcodeproj/project.pbxproj
          grep "objectVersion" UySimulyatori.xcodeproj/project.pbxproj

      - name: Build Xcode Archive
        run: |
          xcodebuild -project UySimulyatori.xcodeproj \
                     -scheme UySimulyatori \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -archivePath "build/UySimulyatori.xcarchive" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Package unsigned IPA for Sideloadly
        run: |
          mkdir -p build/Payload
          cp -r "build/UySimulyatori.xcarchive/Products/Applications/UySimulyatori.app" build/Payload/
          cd build && zip -r UySimulyatori.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UySimulyatori-Sideloadly-IPA
          path: build/UySimulyatori.ipa

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/UySimulyatori.ipa
          tag_name: ${{ github.ref_name }}
          name: UySimulyatori iOS ${{ github.ref_name }}
          draft: false
          prerelease: false