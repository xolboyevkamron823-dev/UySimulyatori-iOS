name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Xcode Archive
        run: |
          xcodebuild -project UySimulyatori.xcodeproj \
                     -scheme UySimulyatori \
                     -configuration Release \
                     -destination "generic/platform=iOS" \
                     -archivePath "build/UySimulyatori.xcarchive" \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     archive

      - name: Package unsigned IPA for Sideloadly
        run: |
          mkdir -p build/Payload
          cp -r "build/UySimulyatori.xcarchive/Products/Applications/UySimulyatori.app" build/Payload/
          cd build && zip -r UySimulyatori.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UySimulyatori-Sideloadly-IPA
          path: build/UySimulyatori.ipa